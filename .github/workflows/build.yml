name: Compat build
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: compat-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: 校验依赖准备和发布工具
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_*.py'
          node --test tools/release.test.mjs
      - name: 下载同版本正式 Release Maven ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          python tools/prepare-upstreams.py 2>&1 | tee build/ci/upstreams.log
      - name: 独立完整构建与精确发布资产
        shell: bash
        env:
          UILIB_JDK8: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          set -euo pipefail
          ./gradlew build releaseAssets --no-daemon --console=plain 2>&1 | tee build/ci/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: compat-release
          compression-level: 0
          path: build/release/
          if-no-files-found: error
      - name: 保存构建证据与失败报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-build-reports
          path: |
            build/reports/
            build/test-results/
            build/ci/upstreams.json
            build/ci/upstreams.log
            build/ci/build.log
          if-no-files-found: warn
