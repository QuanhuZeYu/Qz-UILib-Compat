name: Compat build
on:
  push:
    branches: ["**"]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      uilibRepository:
        description: 可选显式 Maven URL；留空则检查并下载同版本上游 Release
        required: false
        type: string
concurrency:
  group: compat-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXPLICIT_MAVEN_REPOSITORY: ${{ inputs.uilibRepository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查上游 Release 就绪状态
        id: upstreams
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const properties = fs.readFileSync('gradle.properties', 'utf8');
          const values = [...properties.matchAll(/^uilibVersion[ \t]*=[ \t]*(.*)$/gm)];
          if (values.length !== 1) throw new Error('uilibVersion 必须唯一声明');
          const version = values[0][1].trim();
          if (!/^\d+\.\d+\.\d+(?:[.-](?:alpha|beta|rc)[.-]?\d+)?$/.test(version))
            throw new Error('uilibVersion 必须是精确正式版本');
          process.env.UPSTREAM_RELEASES = JSON.stringify([
            { repo: 'QuanhuZeYu/Qz-UILib-Core', tag: version, asset: 'qz-uilib-core-' + version + '-maven.zip' },
            { repo: 'QuanhuZeYu/Qz-UILib-Platform', tag: version, asset: 'qz-uilib-platform-' + version + '-maven.zip' },
            { repo: 'QuanhuZeYu/Qz-UILib', tag: version, asset: 'qz-uilib-minecraft-' + version + '-maven.zip' }
          ]);
          require('./.github/scripts/upstream-ready.cjs');
          NODE
      - uses: actions/setup-java@v4
        if: steps.upstreams.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/setup-java@v4
        if: steps.upstreams.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.upstreams.outputs.ready == 'true'
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: 校验依赖准备和发布工具
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_*.py'
          node --test tools/release.test.mjs
      - name: 下载同版本正式 Release Maven ZIP
        if: steps.upstreams.outputs.ready == 'true' && env.EXPLICIT_MAVEN_REPOSITORY == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          python tools/prepare-upstreams.py 2>&1 | tee build/ci/upstreams.log
      - name: 独立完整构建与精确发布资产
        if: steps.upstreams.outputs.ready == 'true'
        shell: bash
        env:
          UILIB_JDK8: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          set -euo pipefail
          mkdir -p build/ci
          repository_args=()
          if [[ -n "$EXPLICIT_MAVEN_REPOSITORY" ]]; then
            repository_args+=("-PuilibRepository=$EXPLICIT_MAVEN_REPOSITORY")
          fi
          ./gradlew build releaseAssets "${repository_args[@]}" --no-daemon --console=plain 2>&1 | tee build/ci/build.log
      - uses: actions/upload-artifact@v4
        if: steps.upstreams.outputs.ready == 'true'
        with:
          name: compat-release
          compression-level: 0
          path: build/release/
          if-no-files-found: error
      - name: 保存构建证据与失败报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-build-reports
          path: |
            build/reports/
            build/test-results/
            build/ci/upstreams.json
            build/ci/upstreams.log
            build/ci/build.log
          if-no-files-found: warn
