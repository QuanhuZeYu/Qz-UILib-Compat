import java.security.MessageDigest
import java.util.zip.ZipFile
import groovy.json.JsonOutput

buildscript { repositories { mavenCentral() }; dependencies { classpath 'org.ow2.asm:asm:9.9' } }
plugins { id 'java'; id 'maven-publish' }
group = 'asia.quanhuzeyu.uilib'
version = providers.gradleProperty('compatVersion').getOrElse('1.0.0-local.20261021.1')
if (!(version.toString() ==~ /[A-Za-z0-9][A-Za-z0-9._+-]*/)) throw new GradleException('compatVersion必须是安全文件名与Java版本文本')
// 保留显式 Maven URL/版本入口；独立构建默认消费本仓下载的 Release Maven ZIP。
def uilibVersion = findProperty('uilibVersion')?.toString() ?: '5.0.0-local.selection-20261021.1'
def hostVersion = findProperty('uilibHostVersion')?.toString() ?: uilibVersion
def uilibRepository = findProperty('uilibRepository')?.toString() ?: layout.buildDirectory.dir('ci/maven').get().asFile.toURI().toString()
repositories {
    mavenCentral { content { includeGroup 'org.lwjgl'; includeGroup 'org.lwjgl.lwjgl'; includeGroup 'org.joml'; includeGroup 'com.ibm.icu'; includeGroup 'org.ow2.asm' } }
    maven { url = uri(uilibRepository) }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    maven { url = 'https://maven.minecraftforge.net'; metadataSources { mavenPom(); artifact() } }
    maven { url = 'https://repo.spongepowered.org/maven' }
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    mavenCentral()
}
configurations { hostInterface; coreInterface; platformInterface; lwjgl3Binding; rfbApi; nativeInputHost; angelica2210Abi; angelica2228Abi; ae21050Abi; ae21080Abi; unimixinsAbi }
configurations.configureEach { transitive = false }
dependencies {
    hostInterface "asia.quanhuzeyu.uilib:minecraft-host:$hostVersion:development-java8"
    coreInterface "asia.quanhuzeyu.uilib:core:$uilibVersion:development-java8"
    ['gl-renderer','font-adapter','lwjgl2-adapter','lwjgl3-adapter'].each { platformInterface "asia.quanhuzeyu.uilib:$it:$uilibVersion:java8" }
    lwjgl3Binding "asia.quanhuzeyu.uilib:lwjgl3-adapter:$uilibVersion:java8"
    compileOnly 'net.minecraftforge:forge:1.7.10-10.13.4.1614-1.7.10:universal'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    rfbApi 'com.github.GTNewHorizons:lwjgl3ify:3.0.20:forgePatches'
    nativeInputHost 'com.github.GTNewHorizons:lwjgl3ify:3.0.31:dev'
    // 必须读取正式发行 Jar 的真实 descriptor；不能以 dev/API Jar 或缺席路径代替。
    angelica2210Abi 'com.github.GTNewHorizons:Angelica:2.2.10@jar'
    angelica2228Abi 'com.github.GTNewHorizons:Angelica:2.2.28@jar'
    ae21050Abi 'com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1050-GTNH@jar'
    ae21080Abi 'com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1080-GTNH@jar'
    unimixinsAbi 'io.github.legacymoddingmc:unimixins:0.3.1@jar'
    testImplementation 'org.ow2.asm:asm-commons:9.9'
    compileOnly 'org.ow2.asm:asm-tree:9.9'
    compileOnly 'org.ow2.asm:asm:9.9'
    testCompileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.3'
    testImplementation 'org.joml:joml:1.10.9'
    testRuntimeOnly 'com.ibm.icu:icu4j:76.1'
    testRuntimeOnly 'org.yaml:snakeyaml:2.4'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-api:2.17.2'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.17.2'
    testRuntimeOnly 'com.google.guava:guava:17.0'
    testRuntimeOnly 'org.apache.commons:commons-lang3:3.3.2'
    ['lwjgl-freetype','lwjgl-harfbuzz'].each { testImplementation "org.lwjgl:$it:3.4.3" }
    ['lwjgl','lwjgl-freetype','lwjgl-opengl','lwjgl-glfw','lwjgl-sdl'].each { testRuntimeOnly "org.lwjgl:$it:3.4.3:natives-windows" }
    testImplementation 'org.lwjgl:lwjgl:3.4.3'
    testImplementation 'org.lwjgl:lwjgl-opengl:3.4.3'
    testImplementation 'org.lwjgl:lwjgl-glfw:3.4.3'
    testImplementation 'org.lwjgl:lwjgl-sdl:3.4.3'
    testImplementation "asia.quanhuzeyu.uilib:core-verification:$uilibVersion"
    testImplementation "asia.quanhuzeyu.uilib:platform-verification:$uilibVersion"
}
sourceSets.main.compileClasspath += configurations.hostInterface + configurations.coreInterface + configurations.platformInterface + configurations.rfbApi
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
java { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
def generatedVersion = layout.buildDirectory.dir('generated/version')
tasks.register('generateCompatVersion') {
    inputs.property 'compatVersion', project.version.toString()
    outputs.dir generatedVersion
    doLast {
        def target = new File(generatedVersion.get().asFile, 'club/heiqi/uilib/compat/CompatVersion.java')
        target.parentFile.mkdirs()
        target.text = 'package club.heiqi.uilib.compat; public final class CompatVersion { public static final String VERSION = "' + project.version + '"; }'
    }
}
sourceSets.main.java.srcDir generatedVersion
compileJava.dependsOn 'generateCompatVersion'
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
def markedBinding = layout.buildDirectory.dir('generated/marked-binding')
tasks.register('prepareLwjgl3Binding') {
    inputs.files configurations.lwjgl3Binding
    outputs.dir markedBinding
    doLast {
        new ZipFile(configurations.lwjgl3Binding.singleFile).withCloseable { zip ->
            def name = 'club/heiqi/uilib/host/client/gl/Lwjgl3GlApi.class'
            def reader = new org.objectweb.asm.ClassReader(zip.getInputStream(zip.getEntry(name)))
            def writer = new org.objectweb.asm.ClassWriter(reader, 0)
            reader.accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, writer) {
                @Override void visitEnd() {
                    writer.visitAnnotation('Lme/eigenraven/lwjgl3ify/api/Lwjgl3Aware;', true).visitEnd()
                    super.visitEnd()
                }
            }, 0)
            def target = new File(markedBinding.get().asFile, name)
            target.parentFile.mkdirs(); target.bytes = writer.toByteArray()
        }
    }
}
jar {
    dependsOn 'prepareLwjgl3Binding'
    from markedBinding
    from({ zipTree(configurations.lwjgl3Binding.singleFile) }) { include 'META-INF/THIRD-PARTY-NOTICES.md' }
    archiveBaseName = 'qz_uilib_compat'
    from('LICENSE')
    manifest { attributes('TweakClass':'org.spongepowered.asm.launch.MixinTweaker','TweakOrder':'0','MixinConfigs':'mixins.qz_uilib_compat.json','FMLCorePluginContainsFMLMod':'true','ForceLoadAsMod':'true') }
}
tasks.register('verifyArtifact') {
    dependsOn jar
    doLast {
        new ZipFile(jar.archiveFile.get().asFile).withCloseable { zip ->
            def binding = 'club/heiqi/uilib/host/client/gl/Lwjgl3GlApi.class'
            def marker = 'Lme/eigenraven/lwjgl3ify/api/Lwjgl3Aware;'
            def canonical = { byte[] bytes ->
                def writer = new org.objectweb.asm.ClassWriter(0)
                new org.objectweb.asm.ClassReader(bytes).accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, writer) {
                    @Override org.objectweb.asm.AnnotationVisitor visitAnnotation(String descriptor, boolean visible) {
                        return descriptor == marker ? null : super.visitAnnotation(descriptor, visible)
                    }
                }, 0)
                writer.toByteArray()
            }
            new ZipFile(configurations.lwjgl3Binding.singleFile).withCloseable { original ->
                assert Arrays.equals(canonical(zip.getInputStream(zip.getEntry(binding)).bytes), canonical(original.getInputStream(original.getEntry(binding)).bytes)) : 'LWJGL3 binding除标记外发生改写'
            }
            def marked = []
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    def data = new DataInputStream(zip.getInputStream(entry))
                    assert data.readInt() == 0xcafebabe as int
                    data.readUnsignedShort(); assert data.readUnsignedShort() == 52 : entry.name
                    assert entry.name.startsWith('club/heiqi/uilib/compat/') || entry.name == 'club/heiqi/uilib/host/client/gl/Lwjgl3GlApi.class' : entry.name
                    data.close()
                    def reader = new org.objectweb.asm.ClassReader(zip.getInputStream(entry))
                    reader.accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
                        @Override org.objectweb.asm.AnnotationVisitor visitAnnotation(String descriptor, boolean visible) {
                            if (descriptor == marker) marked.add(entry.name)
                            return null
                        }
                    }, org.objectweb.asm.ClassReader.SKIP_CODE)
                }
            }
            assert marked == [binding] : 'LWJGL3Aware只能位于独立binding'
        }
    }
}
def sha = { File file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
tasks.register('installManifest') {
    dependsOn build
    doLast {
        def file = jar.archiveFile.get().asFile
        def dependencies = [configurations.hostInterface, configurations.coreInterface, configurations.platformInterface].collectMany { configuration ->
            configuration.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                [group:artifact.moduleVersion.id.group,module:artifact.name,version:artifact.moduleVersion.id.version,classifier:artifact.classifier ?: '',source:artifact.file.absolutePath,sha256:sha(artifact.file)]
            }
        }
        def output = layout.buildDirectory.file('install-manifest.json').get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion:1,host:'legacy',version:project.version.toString(),files:[[name:file.name,source:file.absolutePath,sha256:sha(file)]],dependencies:dependencies])) + '\n'
    }
}
def abiInputs = [
    angelica2210Abi:'GT_New_Horizons_2.9.0-beta-3_Java_17-26/.minecraft/mods/angelica-2.2.10.jar',
    ae21050Abi:'GT_New_Horizons_2.9.0-beta-3_Java_17-26/.minecraft/mods/appliedenergistics2-rv3-beta-1050-GTNH.jar',
    angelica2228Abi:'GT_New_Horizons_2.9.0-RC-2_Java_17-26/.minecraft/mods/angelica-2.2.28.jar',
    ae21080Abi:'GT_New_Horizons_2.9.0-RC-2_Java_17-26/.minecraft/mods/appliedenergistics2-rv3-beta-1080-GTNH.jar',
    unimixinsAbi:'GT_New_Horizons_2.9.0-RC-2_Java_17-26/.minecraft/mods/+unimixins-all-1.7.10-0.3.1.jar'
]
// 旧实机入口继续可用；默认始终解析上面的公开正式坐标，缺失即失败。
def actualJar = { String name ->
    def prism = providers.gradleProperty('compatPrismRoot')
    def artifact = prism.isPresent() ? file(prism.get() + '/instances/' + abiInputs[name]) : configurations.getByName(name).singleFile
    if (!artifact.isFile()) throw new GradleException('真实 ABI 输入不存在：' + artifact)
    artifact
}
tasks.register('abiInputEvidence') {
    inputs.files providers.provider { abiInputs.keySet().collect { actualJar(it) } }
    outputs.file layout.buildDirectory.file('reports/abi-inputs.json')
    doLast {
        def entries = abiInputs.keySet().collect { name ->
            def artifact = actualJar(name)
            def dependency = configurations.getByName(name).dependencies.iterator().next()
            [coordinate:dependency.group + ':' + dependency.name + ':' + dependency.version, source:artifact.absolutePath, sha256:sha(artifact)]
        }
        def output = layout.buildDirectory.file('reports/abi-inputs.json').get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(entries)) + '\n'
    }
}
// Groovy 的 args [list] 会被解析为下标访问；显式 setArgs(...) 确保传入完整真实 Jar 参数列表。
tasks.register('compatContractScenario', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.compat.mc1710.CompatContractScenario'
    dependsOn 'abiInputEvidence'
    doFirst { setArgs(['angelica2210Abi', 'ae21050Abi', 'angelica2228Abi', 'ae21080Abi'].collect { actualJar(it).absolutePath }) }
}
tasks.register('gtnhCharacterMappingScenario', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.compat.mc1710.gtnh.GtnhCharacterMappingScenario'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    jvmArgs '-Dfile.encoding=UTF-8'
    maxHeapSize = '1024m'
    // Java8 Windows不能解析中文绝对classpath，沿宿主同一启动边界转为相对路径。
    doFirst {
        if (System.getProperty('os.name').toLowerCase().contains('win')) {
            def location = workingDir.toPath()
            def relative = classpath.files.collect { artifact ->
                def absolute = artifact.toPath().toAbsolutePath()
                location.root == absolute.root ? location.relativize(absolute).toString() : absolute.toString()
            }.join(File.pathSeparator)
            classpath = files()
            jvmArgs '-cp', relative
        }
    }
}
check.dependsOn 'gtnhCharacterMappingScenario'
tasks.register('externalReplayScenario', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.compat.mc1710.angelica.shared.ExternalReplayScenario'
}
check.dependsOn 'externalReplayScenario'
tasks.register('angelicaReplayScenario', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.compat.mc1710.angelica.shared.AngelicaReplayScenario'
}
tasks.withType(Test).configureEach { failOnNoDiscoveredTests = false }
['vanillaFontGlScenario':'VanillaFontGlScenario', 'glyphPipelineScenario':'GlyphPipelineScenario'].each { name, type ->
    tasks.register(name, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'club.heiqi.uilib.ui.scene.integration.' + type
        maxHeapSize = '1024m'
    }
}
tasks.register('nativeSdlTextInputScenario', JavaExec) {
    dependsOn testClasses
    classpath = configurations.rfbApi + configurations.nativeInputHost + sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.ui.scene.integration.RfbNativeInputScenario'
    jvmArgs '-Djava.system.class.loader=com.gtnewhorizons.retrofuturabootstrap.RfbSystemClassLoader'
    args 'native-only'
    maxHeapSize = '1024m'
}
tasks.register('irisPassTargetScenario', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.compat.mc1710.angelica.shared.IrisPassTargetGlScenario'
    doFirst { setArgs(['angelica2210Abi', 'angelica2228Abi'].collect { actualJar(it).absolutePath }) }
}

if (providers.gradleProperty('compatPrismRoot').isPresent()) check.dependsOn 'irisPassTargetScenario'

tasks.register('irisProducerBatchScenario', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.compat.mc1710.angelica.shared.IrisProducerGlScenario'
    args 'pure-batch'
}
tasks.register('sdlTextInputScenario', JavaExec) {
    dependsOn testClasses
    classpath = configurations.rfbApi + configurations.nativeInputHost + sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.ui.scene.integration.RfbNativeInputScenario'
    jvmArgs '-Djava.system.class.loader=com.gtnewhorizons.retrofuturabootstrap.RfbSystemClassLoader'
    args 'window'
}
tasks.register('deviceCheck') { dependsOn 'vanillaFontGlScenario', 'glyphPipelineScenario', 'sdlTextInputScenario' }
tasks.register('unimixinsPluginScenario', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.heiqi.uilib.compat.mc1710.UniMixinsPluginScenario'
    dependsOn 'abiInputEvidence'
    doFirst { setArgs(['unimixinsAbi', 'angelica2210Abi', 'angelica2228Abi'].collect { actualJar(it).absolutePath }) }
}
check.dependsOn 'unimixinsPluginScenario', 'verifyArtifact', 'compatContractScenario', 'angelicaReplayScenario', 'irisProducerBatchScenario', 'nativeSdlTextInputScenario'
publishing {
    publications { compat(MavenPublication) { from components.java } }
    repositories { maven { name = 'release'; url = layout.buildDirectory.dir('release-maven') } }
}
// 从本次任务输出收集，避免发布 build/libs 中残留的其他版本。
def releaseMavenZip = tasks.register('releaseMavenZip', Zip) {
    dependsOn 'publishCompatPublicationToReleaseRepository'
    from(layout.buildDirectory.dir('release-maven')) {
        include project.group.toString().replace('.', '/') + '/' + project.name + '/' + project.version + '/**'
    }
    archiveFileName = "qz-uilib-compat-${project.version}-maven.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.register('releaseAssets', Sync) {
    dependsOn 'installManifest', releaseMavenZip
    from jar.archiveFile
    from releaseMavenZip.flatMap { it.archiveFile }
    from layout.buildDirectory.file('install-manifest.json')
    into layout.buildDirectory.dir('release')
}
